<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>知言 · AI 聊天</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<aside><a class="brand" href="/">✳ <span>知言 <small>AI WORKSPACE</small></span></a><button id="new-chat" class="new">＋ 新建对话</button><div class="side-label">你的思考空间</div><p class="side-copy">从一个问题开始，<br>让想法更进一步。</p><a class="status-link" href="/status">◉ 部署与连接状态 ↗</a><small class="side-note">对话仅保留在当前页面<br>刷新或关闭页面后清除</small></aside>
<main><header><span>AI 助手 <span class="tag">个人空间</span></span><a href="/status" id="connection">正在检查连接…</a></header><div class="chat-area"><section id="welcome"><div class="symbol">✳</div><p class="eyebrow">一点灵感，无限可能</p><h1>今天，想聊些什么？</h1><p class="subtitle">一起整理思路、探索问题，把想法变成行动。</p><div class="suggestions"><button data-prompt="帮我把一个想法变成可执行的计划，先问我三个关键问题。"><b>↗ 梳理一个想法</b><span>把模糊的灵感变成行动计划</span></button><button data-prompt="帮我润色一段文字，请先让我提供原文和希望的语气。"><b>✎ 写出更好的表达</b><span>写作、润色，让表达更清晰</span></button><button data-prompt="我想学习一个新概念，请先问我想了解什么，再用简单的例子解释。"><b>◎ 学习一个新概念</b><span>用简单的例子，理解复杂的问题</span></button></div></section><div id="messages" role="log" aria-label="聊天记录" aria-live="polite"></div></div>
<div class="composer-wrap"><details><summary>应用访问口令</summary><label for="token">输入部署时设置的访问口令（不是 API 密钥）</label><input id="token" type="password" autocomplete="off" placeholder="口令只保留在当前页面"></details><p id="notice" role="status"></p><form id="chat-form"><label class="sr-only" for="prompt">输入消息</label><textarea id="prompt" rows="2" maxlength="8000" placeholder="输入你的问题，让我们一起想一想…" required></textarea><div class="composer-bottom"><span>Enter 发送 · Shift + Enter 换行</span><button id="send" type="submit" disabled>发送 ↑</button></div></form><p class="footnote">AI 可能会出错，请核实重要信息。消息将发送至模型服务。</p></div></main></body></html>
