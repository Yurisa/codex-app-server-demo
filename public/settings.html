<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI 配置 · 知言</title><link rel="stylesheet" href="/style.css"><script src="/settings.js" defer></script></head><body class="status-page"><main class="status-main settings-main"><a class="back" href="/status">← 返回运行状态</a><div class="symbol">⚙</div><p class="eyebrow">仅所有者可管理</p><h1>连接你的 DeepSeek</h1><p class="subtitle">密钥在服务端加密保存，不写入源码或浏览器存储。</p><p id="settings-state" role="status">正在读取配置状态…</p><form id="settings-form"><label for="model">模型名称</label><input id="model" name="model" value="deepseek-flash" maxlength="100" required><label for="api-key">DeepSeek API Key</label><input id="api-key" type="password" autocomplete="new-password" maxlength="1024" placeholder="输入 DeepSeek API Key"><p class="field-hint" id="key-hint">第一次配置需填写密钥。</p><label for="access-token">应用访问口令</label><input id="access-token" type="password" autocomplete="new-password" minlength="12" maxlength="256" placeholder="设置至少 12 位的口令"><p class="field-hint">请记住此口令，聊天时需要输入。它不是 API Key。</p><p class="field-hint">服务地址固定为 https://api.deepseek.com。保存不会发起付费模型调用。</p><button id="save-settings" disabled type="submit">加密保存配置</button><a class="chat-return" href="/">返回聊天 →</a></form><p class="subtitle">已保存的密钥和口令不会回显；更新配置时留空即可保留。保存成功后输入框会清空。</p></main></body></html>
