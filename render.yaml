services:
  - type: web
    name: codex-ai-chat
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: deepseek-flash
      - key: AI_BASE_URL
        value: https://api.deepseek.com
      - key: CHAT_ACCESS_TOKEN
        generateValue: true
